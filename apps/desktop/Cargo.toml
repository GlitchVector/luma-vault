[package]
name = "luma-vault"
version = "0.1.0"
description = "Local media vault — watches folders, scans images and videos, classifies them, and renders them fast."
authors = ["Glitch Vector"]
edition = "2021"
rust-version = "1.82"

[lib]
# staticlib/cdylib are what a future mobile entry point would link against;
# rlib is what the integration tests and contract tests link against.
name = "luma_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No `protocol-asset`: the built-in asset:// protocol is switched off in
# tauri.conf.json because everything goes through the custom `luma://` scheme,
# which enforces the watched-folder allowlist. Enabling both would leave an
# unchecked path to the filesystem sitting next to the checked one.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# bundled: ship SQLite with the binary rather than depending on whatever the
# host has. The index is the app's own private store, so there is no reason to
# inherit the system library's version or its build flags.
rusqlite = { version = "0.32", features = ["bundled"] }

# Thumbnailing. Default features minus the formats we never read keeps the
# binary smaller; `image` pulls a decoder per format otherwise.
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
  "bmp",
  "tiff",
] }

walkdir = "2"
rayon = "1"
notify = "6"
notify-debouncer-full = "0.3"

sha2 = "0.10"
percent-encoding = "2"
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
num_cpus = "1"

[dev-dependencies]
tempfile = "3"

[features]
# Tauri's default: the custom-protocol feature is switched on by `tauri build`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Dependencies are optimized even in a dev build; this crate is not.
#
# `tauri dev` builds with the dev profile, and an unoptimized pure-Rust image
# decoder is not slow by a little. Measured on this library's own files, over
# the share it actually lives on:
#
#   decode a 0.6 MB JPEG   dev 0.400s   release 0.007s   — 57x
#
# At 66,000 files that is the difference between a scan you wait days for and
# one you wait minutes for, and it made the thumbnail phase look network-bound
# when reading the file was only 3% of the cost.
#
# `package."*"` covers dependencies only, so `luma-vault` itself stays at
# opt-level 0 and incremental rebuilds of the app's own code stay fast.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
