name: validate

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build the SPA
        run: pnpm --filter @luma/web build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads `rust-toolchain.toml`, so the version lives in one place and
      # CI cannot drift from a dev machine. Not `stable`: the cache below is
      # keyed on the compiler's identity, and a Rust release would otherwise
      # throw the whole thing away on whatever morning it happened to land.
      - name: Install the pinned toolchain
        run: |
          version=$(sed -ne 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$version" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$version" --profile minimal --component clippy

      # Tauri's Linux build needs the webkit stack even for `cargo check`,
      # because tauri-build resolves the system webview at compile time.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Pinned to a commit, not to `@v2`. That tag moves: v2.9.2 landed on the
      # morning of 2026-08-06 and changed the key it computes, which orphaned
      # every cache in the repository at once — five gigabytes of them — and
      # every run that day rebuilt the graph from scratch.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
        with:
          workspaces: apps/desktop
          # Restore on every branch, save only on main. Each run writes over a
          # gigabyte, the repository's budget is ten, and GitHub evicts
          # least-recently-used — so a handful of pull-request runs push out the
          # one cache every branch restores from, and then everything is cold.
          # A branch that has not touched Cargo.lock gets a full hit from main
          # anyway, so this costs those runs nothing.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri-build refuses to run when frontendDist is missing, and the Rust
      # job deliberately does not install Node just to satisfy that check.
      - name: Stub the frontend dist
        run: |
          mkdir -p apps/web/dist
          echo '<!doctype html><title>ci</title>' > apps/web/dist/index.html

      # `--profile ci` is the dev profile without the optimized dependencies —
      # see the profile's comment in Cargo.toml. Both steps use it so they share
      # one set of artifacts; running one under `dev` and the other under `ci`
      # would compile the graph twice over and cache both.
      - name: Clippy
        run: cargo clippy --locked --profile ci --manifest-path apps/desktop/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --profile ci --manifest-path apps/desktop/Cargo.toml

  classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the classifier requirements
        run: pip install -r sidecar/classifier/requirements.txt

      # The worker's own self-check: can it import everything and load the model?
      - name: Self-check
        run: python sidecar/classifier/classify_worker.py --check

      # An end-to-end protocol test against a generated image. Proves the
      # handshake, the request/response framing, index alignment on failure and
      # clean shutdown — without asserting anything about the model's output.
      - name: Protocol smoke test
        run: |
          python - <<'PY'
          from PIL import Image
          Image.new("RGB", (320, 240), (128, 128, 128)).save("/tmp/probe.jpg")
          PY
          printf '{"id":1,"cmd":"ping"}\n{"id":2,"cmd":"classify","paths":["/tmp/probe.jpg","/tmp/missing.jpg"]}\n{"cmd":"shutdown"}\n' \
            | python sidecar/classifier/classify_worker.py > /tmp/out.jsonl
          python - <<'PY'
          import json, sys
          lines = [json.loads(line) for line in open("/tmp/out.jsonl") if line.strip()]
          kinds = [line.get("type") for line in lines]
          assert kinds[0] == "ready", f"expected a ready handshake, got {kinds}"
          assert "pong" in kinds, f"ping was not answered: {kinds}"
          result = next(line for line in lines if line.get("type") == "result")
          assert len(result["results"]) == 2, "one result per path, always"
          assert result["results"][0]["ok"] is True, result["results"][0]
          assert result["results"][1]["ok"] is False, "a missing file must fail in place"
          for detection in result["results"][0]["detections"]:
              x, y, w, h = detection["box"]
              assert all(0.0 <= v <= 1.0 for v in (x, y, w, h)), f"box not normalised: {detection}"
          print("classifier protocol OK")
          PY
